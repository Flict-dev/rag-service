services:
  postgres:
    image: postgres:17-alpine
    container_name: rag-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_service
      POSTGRES_USER: rag_service
      POSTGRES_PASSWORD: rag_service_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_service -d rag_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-service-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: rag-service-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-service-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
      DATABASE_URL: postgresql+psycopg://rag_service:rag_service_password@postgres:5432/rag_service
      UPLOAD_DIR: /app/backend/data/uploads
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_chunks
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen3:4b
      OLLAMA_EMBED_MODEL: embeddinggemma
      RAG_TOP_K: 4
      RAG_MIN_SCORE: 0.35
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/backend/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    command: >
      sh -c "python -m alembic -c backend/alembic.ini upgrade head &&
             python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 4000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://127.0.0.1:4000
    container_name: rag-service-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  seed:
    profiles:
      - tools
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://rag_service:rag_service_password@postgres:5432/rag_service
      UPLOAD_DIR: /app/backend/data/uploads
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_chunks
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen3:4b
      OLLAMA_EMBED_MODEL: embeddinggemma
      RAG_TOP_K: 4
      RAG_MIN_SCORE: 0.35
    volumes:
      - backend_uploads:/app/backend/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python -m alembic -c backend/alembic.ini upgrade head &&
             python -m backend.app.seed"

volumes:
  pg_data:
  qdrant_data:
  ollama_data:
  backend_uploads:
