services:
  postgres:
    image: postgres:17-alpine
    container_name: rag-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_service
      POSTGRES_USER: rag_service
      POSTGRES_PASSWORD: rag_service_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_service -d rag_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-service-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: rag-service-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pg_data:
  qdrant_data:
  ollama_data:
